name: Bang! — dernier joueur en vie en 7 jours (archivé)

permissions:
  contents: read

on:
  # 📦 Jeu archivé (30/10) : pas de relance prévue pour le moment, schedule
  # volontairement commenté (seul workflow_dispatch reste disponible). À
  # décommenter en cas de relance, en retirant aussi `archived: true` dans
  # jeux/discord/handlers/minijeux.js (voir jeux/CONTRIBUTING.md).
  # schedule:
  #   # Créneau réservé : minute 18 (jamais la même minute que les autres
  #   # crons de 8h UTC, voir jeux/CONTRIBUTING.md, section « Crons GitHub
  #   # Actions (jeux spéciaux) »). Le cron passe --require-active : il
  #   # n'avance qu'une partie déjà lancée à la main (workflow_dispatch).
  #   - cron: "18 8 * * *"
  workflow_dispatch: {}

jobs:
  post-jour:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      # Bot des jeux (jeux/env.js) : vides tant que les secrets n'existent pas.
      DISCORD_JEUX_TOKEN: ${{ secrets.DISCORD_JEUX_TOKEN }}
      DISCORD_JEUX_APP_ID: ${{ secrets.DISCORD_JEUX_APP_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_FRAME_PUBLIC: ${{ secrets.DISCORD_CHANNEL_FRAME_PUBLIC }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Poste le jour de Bang! (salon public)
        run: npm run bang:public -- ${{ github.event_name == 'schedule' && '--require-active' || '' }}
