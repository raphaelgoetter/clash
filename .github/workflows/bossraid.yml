name: Boss Raid — score attack communautaire

permissions:
  contents: read

on:
  # Le jour d'annonce se lance uniquement à la main (workflow_dispatch). Le
  # cron ne fait qu'avancer un Raid déjà en cours (voir --require-active
  # passé au script ci-dessous) : tant qu'aucun lancement manuel n'a eu lieu,
  # il ne se passe rien, ce qui évite qu'un run automatique ne démarre un
  # Raid public sans prévenir pendant une session de test sur le salon de
  # test (l'état est partagé entre les deux, voir CONTRIBUTING.md).
  schedule:
    # Décalé de la ronde (0 8) : 5 crons quotidiens du dépôt tombaient tous à
    # la même minute, la pire pour GitHub Actions (charge maximale en haut
    # d'heure) — voir CONTRIBUTING.md, incident du 27/08.
    - cron: "2 8 * * *"
  workflow_dispatch: {}

jobs:
  post-jour:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_FRAME_PUBLIC: ${{ secrets.DISCORD_CHANNEL_FRAME_PUBLIC }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Poste le jour de Boss Raid (salon public)
        run: npm run bossraid:public -- ${{ github.event_name == 'schedule' && '--require-active' || '' }}
