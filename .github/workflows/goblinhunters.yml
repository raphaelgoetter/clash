name: Goblin Hunters — jeu à identité secrète

permissions:
  contents: read

on:
  # L'ouverture des inscriptions se lance uniquement à la main
  # (workflow_dispatch). Le cron ne fait qu'avancer une partie déjà en cours
  # (rappel d'inscription ou clôture de jour, voir --require-active) : tant
  # qu'aucun lancement manuel n'a eu lieu, il ne se passe rien — même
  # principe que Boss Raid (voir CONTRIBUTING.md).
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  post-etape:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_FRAME_PUBLIC: ${{ secrets.DISCORD_CHANNEL_FRAME_PUBLIC }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Poste l'étape de Goblin Hunters (salon public)
        run: npm run goblinhunters:public -- ${{ github.event_name == 'schedule' && '--require-active' || '' }}
