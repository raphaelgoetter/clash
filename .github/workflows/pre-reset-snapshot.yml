name: Pre-reset snapshots

# Prend une photo instantanée des données GDC 2 minutes avant le reset journalier
# de chaque clan. Les heures de reset sont lues depuis CLAN_RESET_TIMES (dateUtils.js).
# Le script dort précisément jusqu'à T−2 min puis appelle l'API en < 1 seconde.

concurrency:
  group: snapshot-pre-reset
  cancel-in-progress: false

on:
  schedule:
    # 06:00 UTC, ven–lun (capture J1 jeu, J2 ven, J3 sam, J4 dim avant reset du lendemain)
    # Marche d'avance volontaire : GitHub Actions peut retarder un cron planifié de plus de 2 h
    # en cas de forte charge.
    # Les resets des clans sont à 09:45, 09:50 et 09:51 UTC.
    # 06:00 donne 223 min de marge avant le premier T−2 min (09:43) — le script dort jusqu'au bon moment.
    # Commit de resynchronisation (28/08) : bug GitHub documenté où `schedule`
    # se désynchronise silencieusement pendant que `workflow_dispatch`
    # continue de fonctionner — tout commit sur la branche par défaut force
    # un resync côté GitHub (voir CONTRIBUTING.md, « Planification (GitHub Actions) »).
    # Contrairement aux jeux, une occurrence manquée ici est irrécupérable :
    # vérifier manuellement chaque matin ven-lun tant que non confirmé résolu.
    - cron: "0 6 * * 5,6,0,1"
  workflow_dispatch:

jobs:
  pre-reset-snapshot:
    runs-on: ubuntu-latest
    env:
      CLASH_API_KEY: ${{ secrets.CLASH_API_KEY }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Run pre-reset snapshot script
        run: node scripts/preResetSnapshot.js
