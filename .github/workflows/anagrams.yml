name: Anagram — devine la carte

permissions:
  contents: read

on:
  # Samedi, 2 déclenchements : 10h et 18h UTC. Le script décide à chaque
  # déclenchement s'il poste réellement (1 chance sur 2 au premier créneau,
  # garanti au second si rien n'a encore été posté) — voir
  # alreadyPostedThisWeek/computeWeeklySlotIndex/shouldPostThisSlot dans
  # backend/services/anagrams.js. Volontairement limité à 2 créneaux (plutôt
  # que d'en étaler beaucoup sur la journée) : GitHub Actions retarde parfois
  # les déclenchements planifiés, et plus il y a de créneaux, plus ce risque
  # cumulé pousse mécaniquement le tirage vers le dernier créneau garanti.
  schedule:
    - cron: "0 10,18 * * 6"
  workflow_dispatch: {}

jobs:
  post-anagram:
    runs-on: ubuntu-latest
    env:
      CLASH_API_KEY: ${{ secrets.CLASH_API_KEY }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_FRAME_PUBLIC: ${{ secrets.DISCORD_CHANNEL_FRAME_PUBLIC }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Post partie Anagram (salon public, si le tirage au sort le décide)
        run: npm run anagram:public
