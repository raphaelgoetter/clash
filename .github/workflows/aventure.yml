name: Aventure interactive — Livre dont vous êtes le héros

permissions:
  contents: read

on:
  # Cron désactivé : l'Aventure est terminée (partie jouée jusqu'au bout) et
  # aucune suite n'est prévue pour l'instant — inutile de consommer un run
  # quotidien pour rien (postAventure() détecte state.termine et ne poste
  # rien, mais autant ne pas déclencher le workflow du tout). workflow_dispatch
  # reste disponible si une nouvelle Aventure est relancée un jour.
  # schedule:
  #   - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  post-chapitre:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_FRAME_PUBLIC: ${{ secrets.DISCORD_CHANNEL_FRAME_PUBLIC }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Poste le chapitre du jour (salon public)
        run: npm run aventure:public
