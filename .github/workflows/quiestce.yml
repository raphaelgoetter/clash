name: Qui est-ce ? — démasque les cartes secrètes en 7 jours

permissions:
  contents: read

on:
  # Créneau réservé : minute 20 (prochaine libre après bang=18 — jamais la
  # même minute que les autres crons de 8h UTC, voir jeux/CONTRIBUTING.md,
  # incident du 27/08). Le cron passe --require-active : il n'avance
  # qu'une partie déjà lancée à la main (workflow_dispatch).
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch: {}

jobs:
  post-jour:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_FRAME_PUBLIC: ${{ secrets.DISCORD_CHANNEL_FRAME_PUBLIC }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Poste le jour de Qui est-ce ? (salon public)
        run: npm run quiestce:public -- ${{ github.event_name == 'schedule' && '--require-active' || '' }}
