name: Jeux de lettres — Anagram / Pêle-mêle (alternance saisonnière)

permissions:
  contents: read

on:
  # Samedi, 2 déclenchements : 10h et 18h UTC — remplace l'ancien cron dédié
  # à Anagram seul (.github/workflows/anagrams.yml, supprimé). Le script
  # décide lui-même, à chaque déclenchement : (1) quel jeu est actif cette
  # saison Clash Royale (Anagram / Pêle-mêle en alternance, une saison sur
  # deux — voir backend/services/jeuxdelettres.js), (2) s'il poste réellement
  # (1 chance sur 2 au premier créneau, garanti au second si rien n'a encore
  # été posté), (3) le récap de fin de saison du jeu qui vient de se
  # terminer, quel qu'il soit. Toujours 2 créneaux seulement (pas plus) :
  # GitHub Actions retarde parfois les déclenchements planifiés, et plus il y
  # a de créneaux, plus ce risque cumulé pousse mécaniquement le tirage vers
  # le dernier créneau garanti (biais déjà observé en pratique sur Anagram
  # avec 7 créneaux).
  schedule:
    - cron: "0 10,18 * * 6"
  workflow_dispatch: {}

jobs:
  post-jeux-de-lettres:
    runs-on: ubuntu-latest
    env:
      CLASH_API_KEY: ${{ secrets.CLASH_API_KEY }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_FRAME_PUBLIC: ${{ secrets.DISCORD_CHANNEL_FRAME_PUBLIC }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Post Jeux de lettres (salon public, jeu actif décidé par le script)
        run: npm run lettres:public
