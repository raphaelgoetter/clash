name: Quiz thématique

permissions:
  contents: read

on:
  # Le lancement se fait uniquement à la main (workflow_dispatch) et publie
  # le jour de présentation (annonce), jamais le Jour 1 directement. Le cron
  # ne fait qu'avancer une manche déjà lancée (annonce -> Jour 1 le
  # lendemain, puis jour après jour, voir --require-active passé
  # au script ci-dessous) : tant qu'aucun lancement manuel n'a eu lieu, il ne se
  # passe rien.
  schedule:
    # Décalé de la ronde (0 8) : 5 crons quotidiens du dépôt tombaient tous à
    # la même minute, la pire pour GitHub Actions (charge maximale en haut
    # d'heure) — voir jeux/CONTRIBUTING.md, section « Crons GitHub Actions (jeux spéciaux) ».
    # Commit de resynchronisation (28/08) : bug GitHub documenté où `schedule`
    # se désynchronise silencieusement pendant que `workflow_dispatch`
    # continue de fonctionner — tout commit sur la branche par défaut force
    # un resync côté GitHub (voir jeux/CONTRIBUTING.md).
    - cron: "6 8 * * *"
  workflow_dispatch: {}

jobs:
  post-jour:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      # Bot des jeux (jeux/env.js) : vides tant que les secrets n'existent pas.
      DISCORD_JEUX_TOKEN: ${{ secrets.DISCORD_JEUX_TOKEN }}
      DISCORD_JEUX_APP_ID: ${{ secrets.DISCORD_JEUX_APP_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_FRAME_PUBLIC: ${{ secrets.DISCORD_CHANNEL_FRAME_PUBLIC }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Poste le jour du Quiz (salon public)
        run: npm run quiz:public -- ${{ github.event_name == 'schedule' && '--require-active' || '' }}
